[package]
name = "aimoviestorage"
version = "0.3.1"
description = "AIMovieStorage local AI preproduction workspace"
authors = ["AIMovieStorage"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "aimoviestorage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 실행 파일 이름을 **따로** 적습니다.
#
# 설치 폴더·제품 이름은
# `AIMovieStorage` 인데 실행 파일만 `frameforge.exe` 였고, 무설치본 이름도 그것을 따라
# `frameforge_portable.zip` 이 됐습니다(릴리스 목록에서 둘이 섞여 보였습니다).
#
# 꾸러미 이름(`name`)은 소문자가 관례라 그대로 두고, 사람이 보는 실행 파일만 여기서
# 정합니다. 업데이터가 설치 파일 이름을 그대로 쓰므로 **업데이터를 켜기 전에** 맞춰
# 둡니다 — 나중에 바꾸면 첫 자동 업데이트가 옛 이름의 실행 파일을 남깁니다.
[[bin]]
name = "AIMovieStorage"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# protocol-asset — convertFileSrc 가 만든 asset:// 주소를 웹뷰가 열 수 있게 합니다.
# 이 피처가 없으면 tauri.conf 에서 켜도 등록 코드 자체가 빌드에 안 들어갑니다.
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rfd = "0.15"
arboard = "3.4"
image = "0.25"

# 아래 넷은 사고로 잃은 Cargo.toml 에 있었던 것을 되살린 것입니다.
# 살아남은 사본이 8월 12일 판이라 그 뒤에 추가된 것들이 빠져 있었습니다.
#
# reqwest — LLM 을 Rust 쪽에서 부릅니다. 브라우저에서 직접 부르면 API 키가
# 개발자 도구에 그대로 보이고 CORS 에도 걸립니다.
# base64 — 레퍼런스 이미지를 LLM 에 실어 보낼 때 씁니다.
# tokio — reqwest 가 비동기라 런타임이 필요합니다.
# dirs — API 키를 둘 앱 설정 폴더를 찾습니다.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "charset",
  "http2",
  # multipart — ComfyUI /upload/image 에 그림을 올릴 때 (업스케일 다리)
  "multipart",
  # stream — 16GB 짜리 가중치를 조금씩 받아 진행률을 알리고 이어받기를 합니다.
  "stream",
] }
base64 = "0.22"
# 업스케일 엔진 설치 — 받은 파일의 sha256 확인, 고정 커밋 코드 압축본 풀기.
# zip 은 압축만 쓰면 되므로 기본 피처를 끄고 deflate 만 켭니다(빌드 시간·의존성 절약).
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 마그니픽 데스크톱(WebView2 디버그 포트)에 CDP 로 붙기 위한 WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
dirs = "5"
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
tempfile = "3"
tauri-plugin-updater = "2.12"
tauri-plugin-process = "2.3"

# 마그니픽 데스크톱 창을 찾아 앞으로 가져오고 Ctrl+V 를 넣는 데 씁니다 (Windows 만).
# 0.61 은 tauri 가 이미 끌어오는 판이라 새로 받는 것이 거의 없습니다.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
