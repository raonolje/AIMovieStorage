# 공개판 설치 파일 만들기 — 태그를 밀면 GitHub Releases 에 NSIS 설치 파일이 올라갑니다.
#
# → 저장소에는 **소스**, 설치 파일은 CI 가 만들어 **Releases** 에.
#
# - 어떤 엔진이 빠지는지는 저장소 뿌리의 `edition.json` 한 곳이 정합니다. 여기에는 id 를 적지 않습니다.
# - 윈도우만 만듭니다. 맥은 뺐습니다 — 로컬 워커가 CUDA 를 전제로 하고, 서명·공증까지 갈래가 둘로
# 늘어납니다(`docs/복원/21_배포.md` §6).
# - **코드 서명은 아직 없습니다.** 받은 사람의 윈도우가 SmartScreen 경고(「알 수 없는 게시자」)를 띄웁니다.
# «추가 정보 → 실행» 으로 넘어갑니다. 인증서를 사면 `tauri.conf.json` 의 `bundle.windows.certificateThumbprint`
# 와 여기 `signtool` 걸음을 더합니다.
# - Gitea Actions(자체 호스팅 Gitea)에서도 거의 그대로 돕니다: `actions/*` 는 Gitea 가 GitHub 에서
# 받아 오고, 마지막 «Releases 에 올리기» 만 `softprops/action-gh-release` 대신 Gitea 의 릴리스 API
# (`akkuman/gitea-release-action` 등)로 바꾸면 됩니다. `runs-on: windows-latest` 는 윈도우 러너를 직접
# 등록해야 합니다.
name: 공개판 설치 파일

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      edition:
        description: "판 — public(제외 엔진 빠짐) / private(전부, 사용자 전용 · Releases 에는 안 올림)"
        type: choice
        options: [public, private]
        default: public

permissions:
  # Releases 에 파일을 붙이려면 쓰기 권한이 필요합니다.
  contents: write

jobs:
  # 검사가 먼저입니다. 예전에는 «검사» 워크플로가 따로 돌아서, 시험이 깨진 커밋에 태그를
  # 붙여도 설치 파일이 그대로 나갔습니다(실제로 한 판이 그렇게 나갔습니다). 태그는 보통
  # push 와 같이 오지 않아 다른 워크플로의 결과를 기다릴 수도 없으므로, **여기서 직접** 셉니다.
  # 우분투에서 몇 분이면 끝나고, 실패하면 아래 빌드가 아예 시작되지 않습니다.
  # id 는 **반드시 영문**입니다. 한글 id 를 쓰면 깃허브가 워크플로 전체를 무효로 보고
  # 이름 자리에 파일 경로를 적은 채 실패시킵니다 — 어느 줄이 문제인지 아무 말도 없습니다
  # (2026-09-23 실제로 두 판이 이렇게 죽었습니다). 보이는 이름만 `name:` 으로 한글을 답니다.
  check:
    name: 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm (corepack)
        run: corepack enable
      - name: 의존성
        run: pnpm install --frozen-lockfile
      - name: 타입 검사
        run: pnpm check
      - name: 단위 시험
        run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 파이썬 워커 문법
        run: python -m compileall -q src-tauri/resources

      # 문법만으로는 못 잡는 것이 있습니다. 「여기만 움직인다」 마스크는 프레임의 **자료형과
      # 눈금**을 그대로 지켜야 하는데(diffusers 는 numpy 프레임을 0~1 실수로 보고 255 를
      # 곱합니다), 어긋나도 아무 데서도 예외가 안 나고 영상만 조용히 망가집니다.
      # 모델이 필요 없어 몇 초면 끝납니다.
      - name: 움직임 구역 · 로라 모양
        run: |
          python -m pip install --quiet numpy pillow
          python src-tauri/resources/local/test_freeze_by_mask.py
          python src-tauri/resources/local/test_lora_shapes.py
          python src-tauri/resources/local/test_memory_cleanup.py
          python src-tauri/resources/local/test_image_guidance.py
          python src-tauri/resources/local/test_mocap_hands.py

  windows:
    needs: check
    runs-on: windows-latest
    env:
      # 빌드 스크립트가 이 값도 읽습니다(`scripts/tauri.mjs`). 손으로 돌릴 때는 고른 판, 태그면 공개판.
      FRAMEFORGE_EDITION: ${{ inputs.edition || 'public' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 은 package.json 의 `packageManager` 에 적힌 판(10.x)을 corepack 이 그대로 씁니다 —
      # 여기 판을 따로 적으면 lockfile 과 어긋나는 날이 옵니다.
      - name: pnpm (corepack)
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      # Rust 의존성 캐시 — 600개 크레이트를 매번 처음부터 컴파일하면 20분이 넘습니다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/${{ env.FRAMEFORGE_EDITION }}

      - name: 의존성
        run: pnpm install --frozen-lockfile

      # 빌드 스크립트가 VsDevCmd 를 찾아 MSVC 링커를 잡고, 공개판이면 `edition.json` 의 제외 엔진을
      # 번들 리소스에서 뺀 설정을 `tauri build --config` 로 덧씌웁니다.
      # 서명 열쇠는 저장소 비밀값에서 옵니다 — 저장소에 넣지 않습니다.
      #
      # 이 값이 없으면 번들러가 `.sig` 파일을 안 만들고, 그러면 `latest.json` 을 만드는
      # 걸음이 큰 소리로 멈춥니다. 조용히 넘어가면 「업데이트가 안 된다」 는 보고만 남고
      # 까닭을 못 찾습니다.
      # 비밀값이 닿았는지 **빌드 전에** 봅니다.
      #
      # 없으면 빌드가 「공개 열쇠는 있는데 개인 열쇠가 없다」 로 실패하는데, 그 말만
      # 보고는 «비밀값을 안 넣었나 · 이름이 틀렸나 · 판이 다른가» 를 못 가립니다.
      # 열쇠 자체는 절대 찍지 않고 **길이와 머리글**만 봅니다.
      # 비밀값이 **쓸 수 있는 모양으로** 닿았는지 빌드 전에 봅니다.
      #
      # 없거나 모양이 틀리면 빌드가 「공개 열쇠는 있는데 개인 열쇠가 없다」 로 실패하는데,
      # 그 말만으로는 «안 넣었나 · 이름이 틀렸나 · 붙여넣다 공백이 섞였나» 를 못 가립니다.
      #
      # **열쇠 내용은 한 글자도 찍지 않습니다.** 길이와 「공백이 섞였는가」 만 봅니다.
      - name: 서명 열쇠 확인
        if: startsWith(github.ref, 'refs/tags/v') && env.FRAMEFORGE_EDITION == 'public'
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 비밀값이 비었습니다."
            echo "  저장소 Settings → Secrets and variables → Actions 에 넣어 주세요."
            echo "  이름이 한 글자라도 다르면 여기서 빈 값으로 옵니다."
            exit 1
          fi
          CLEAN="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')"
          echo "받은 길이 ${#RAW_KEY} · 공백을 뺀 길이 ${#CLEAN}"
          if [ "${#RAW_KEY}" != "${#CLEAN}" ]; then
            echo "붙여넣을 때 공백·줄바꿈이 섞였습니다 — 빌드는 걷어내고 씁니다."
          fi
          case "$CLEAN" in
            dW50cnVzdGVkIGNvbW1lbnQ6*)
              echo "머리글 확인 — 열쇠 파일 내용이 맞습니다." ;;
            untrusted*)
              echo "::error::열쇠가 풀린 글자로 들어왔습니다(base64 가 아닙니다)."
              echo "  signer 가 만든 파일 **내용 그대로**를 넣어 주세요."
              exit 1 ;;
            gh\ secret*|*APPDATA*|*.key\"*)
              # 2026-09-23: 열쇠를 넣는 **명령문**이 값으로 들어와 있었습니다.
              # 안내에 명령과 수동 절차를 같이 적었더니 그것이 붙여넣기로 읽혔습니다.
              echo "::error::열쇠가 아니라 **명령문**이 들어온 것 같습니다."
              echo "  Value 칸에는 열쇠 파일의 **내용**을 넣어야 합니다 — 명령이 아니라."
              echo "  파일: %APPDATA%\ai-video-storage\aimoviestorage-updater.key"
              exit 1 ;;
            *)
              echo "::error::열쇠 머리글이 다릅니다."
              echo "  개인 열쇠 파일은 dW50cnVzdGVkIGNvbW1lbnQ6 으로 시작합니다."
              echo "  다른 파일을 넣었거나 값이 잘렸을 수 있습니다."
              exit 1 ;;
          esac

      # 열쇠를 **공백을 걷어내고** 넘깁니다.
      #
      # 비밀값을 화면에서 붙여넣으면 앞뒤에 줄바꿈이 섞이기 쉽습니다. 그대로 넘기면
      # 서명기가 「열쇠 모양이 아니다」 로 죽는데, 화면에는 그 까닭이 안 보입니다
      # (2026-09-23 실제로 여기서 멈췄습니다).
      #
      # 암호는 **빈 값이라도 반드시** 줍니다. 열쇠는 암호를 안 걸어도 「빈 암호로 암호화」
      # 되어 있어서, 이 변수가 없으면 서명기가 암호를 물으며 멈춥니다 — CI 에서는 아무도
      # 답하지 않으니 빌드가 그 자리에서 굳습니다.
      - name: 빌드
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')"
          node scripts/tauri.mjs build --edition "$FRAMEFORGE_EDITION"

      # 업데이터가 읽을 알림 파일. 태그로 올리는 공개판일 때만 만듭니다.
      - name: latest.json
        if: startsWith(github.ref, 'refs/tags/v') && env.FRAMEFORGE_EDITION == 'public'
        run: node scripts/updater-manifest.mjs --tag ${{ github.ref_name }}

      - name: 배포할 파일 확인
        id: artifacts
        run: node scripts/verify-release.mjs

      # 태그로 시작한 공개판만 Releases 에 올립니다. 손으로 돌린 것(특히 비공개판)은 실행 결과에 붙는
      # 작업 산출물로만 남깁니다 — 비공개판을 공개 Releases 에 올리는 사고를 막기 위해서입니다.
      # 공개판 설치 파일은 이름에 «-Public» 이 들어갑니다(`AIMovieStorage-Public_<판>_x64-setup.exe` —
      # 빌드 스크립트가 productName 을 덧씌움). 비공개판과 이름이 같으면 올라간 뒤에는 구분할 길이 없습니다.
      - name: Releases 에 올리기
        if: startsWith(github.ref, 'refs/tags/v') && env.FRAMEFORGE_EDITION == 'public'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # 설치본(NSIS)과 무설치본(zip)을 함께 올립니다 — 「깔기 싫다」 는 쪽을 위해 둘 다 둡니다.
          files: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.portable }}
            ${{ steps.artifacts.outputs.manifest }}
            src-tauri/target/${{ env.FRAMEFORGE_EDITION }}/release/bundle/updater/latest.json
          generate_release_notes: true

      - name: 작업 산출물로 남기기
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && env.FRAMEFORGE_EDITION == 'public') }}
        uses: actions/upload-artifact@v4
        with:
          name: aimoviestorage-${{ env.FRAMEFORGE_EDITION }}-windows
          path: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.portable }}
            ${{ steps.artifacts.outputs.manifest }}
          if-no-files-found: error
