# 타입 검사와 단위 시험 — 밀 때마다 돕니다.
#
# 시험이 104개 있는데 **아무도 안 돌리고 있었습니다.** 저장소에 있던 워크플로는 태그를 밀 때
# 설치 파일을 만드는 것 하나뿐이라, 깨진 채로 올라가도 릴리즈를 만들 때까지 아무도 몰랐습니다.
#
# 이 저장소가 반복해 터뜨린 사고의 모양이 「여덟 곳은 맞고 한 곳만 틀리다」 입니다 —
# 읽어서는 못 찾습니다. 그래서 자료로 세는 시험이 여럿 있는데(앵커 표 ↔ 화면, 창이 품은 목록 ↔
# 여는 문, 세 나라말 사전의 열쇠), 그것들이 돌지 않으면 있으나 마나입니다.
#
# 네이티브 저장·작업 큐·메모리 정책은 Windows 작업에서 별도로 검사합니다.
# Rust 캐시를 재사용하며, 외부 서비스가 필요한 live 시험은 기본 실행에서 제외합니다.
name: 검사

on:
  push:
    branches: ["**"]
    # 태그는 `release.yml` 이 맡습니다 — 같은 걸 두 번 돌릴 까닭이 없습니다.
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 은 package.json 의 `packageManager` 에 적힌 판을 corepack 이 그대로 씁니다 —
      # 여기 판을 따로 적으면 lockfile 과 어긋나는 날이 옵니다.
      - name: pnpm (corepack)
        run: corepack enable

      - name: 의존성
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm check

      - name: 단위 시험
        run: pnpm test

      # 파이썬 워커는 앱과 따로 도는 프로세스라 타입 검사가 안 닿습니다. 문법만이라도 봅니다 —
      # 들여쓰기 하나가 틀리면 엔진이 통째로 안 뜨는데, 그걸 설치 뒤에야 알게 됩니다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파이썬 워커 문법
        run: python -m compileall -q src-tauri/resources

      # 문법만으로는 못 잡는 것이 있습니다. 「여기만 움직인다」 마스크는 프레임의 **자료형과
      # 눈금**을 그대로 지켜야 하는데(diffusers 는 numpy 프레임을 0~1 실수로 보고 255 를
      # 곱합니다), 어긋나도 아무 데서도 예외가 안 나고 영상만 조용히 망가집니다.
      # 모델이 필요 없어 몇 초면 끝납니다.
      - name: 움직임 구역 · 로라 모양
        run: |
          python -m pip install --quiet numpy pillow
          python src-tauri/resources/local/test_freeze_by_mask.py
          python src-tauri/resources/local/test_lora_shapes.py
          python src-tauri/resources/local/test_memory_cleanup.py

  native:
    name: 네이티브 저장·워커 검사
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust 단위 시험
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
